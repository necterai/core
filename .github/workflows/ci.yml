name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm datasets
      - run: pnpm build
      - run: pnpm typecheck
      # The SDK packages support Node 20; the agent zoo's HTTP clients (undici 8) need Node 22.19+.
      - name: Test
        run: |
          if [ "${{ matrix.node }}" = "20" ]; then pnpm -r --filter '!@necterai/zoo' run test; else pnpm test; fi
